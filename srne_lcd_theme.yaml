# Motyw "SRNE LCD" - ciemny, w stylu ekranu falownika SRNE
# Instalacja: skopiuj do /config/themes/srne_lcd.yaml, w configuration.yaml dodaj:
#   frontend:
#     themes: !include_dir_merge_named themes
# i wykonaj: Narzędzia deweloperskie -> YAML -> Przeładuj motywy (albo restart HA).
SRNE LCD:
  primary-color: "#00e5ff"
  accent-color: "#00e676"
  lovelace-background: "linear-gradient(160deg, #040a16 0%, #0a1d38 55%, #050f1f 100%) fixed"
  primary-background-color: "#050d1a"
  secondary-background-color: "#0a1d38"
  card-background-color: "#0b2038"
  ha-card-background: "linear-gradient(145deg, rgba(13,38,70,0.92), rgba(6,17,34,0.94))"
  ha-card-border-radius: "18px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(0,229,255,0.35)"
  ha-card-box-shadow: "0 0 16px rgba(0,229,255,0.12)"
  primary-text-color: "#e6f7ff"
  secondary-text-color: "#7fb3c8"
  disabled-text-color: "#476a7d"
  text-primary-color: "#04121f"
  divider-color: "rgba(0,229,255,0.15)"
  state-icon-color: "#00e5ff"
  state-icon-active-color: "#00e676"
  switch-checked-color: "#00e676"
  switch-checked-track-color: "#00e676"
  slider-color: "#00e5ff"
  slider-track-color: "rgba(0,229,255,0.2)"
  paper-slider-active-color: "#00e5ff"
  mdc-theme-primary: "#00e5ff"
  app-header-background-color: "#06142a"
  app-header-text-color: "#e6f7ff"
  sidebar-background-color: "#06142a"
  sidebar-text-color: "#9ad7ee"
  sidebar-selected-text-color: "#00e5ff"
  sidebar-selected-icon-color: "#00e5ff"
  mush-rgb-blue: "0, 229, 255"
  mush-rgb-green: "0, 230, 118"
  mush-rgb-orange: "255, 152, 0"
  mush-rgb-red: "255, 82, 82"
  mush-rgb-yellow: "255, 193, 7"
