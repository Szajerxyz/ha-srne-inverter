        custom_fields:
          panel: |-
            [[[
            const v=(id)=>{const s=states[id];return (s&&s.state!=='unavailable'&&s.state!=='unknown'&&s.state!=='')?Number(s.state):null;};const f=(x,d=0)=>x===null?'—':x.toFixed(d);const t=(id)=>{const s=states[id];return s?s.state:'—';};

            const on=t('binary_sensor.srne_fault_active')==='on';
            const st=states['sensor.srne_fault_description'];
            let items=(st&&st.attributes&&Array.isArray(st.attributes.faults))?st.attributes.faults.map(x=>({c:x.code,t:x.title,o:x.affects_output})):[];
