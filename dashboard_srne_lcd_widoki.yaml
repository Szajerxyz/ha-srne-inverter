          const col=p!==null&&p<-30?'#00e676':(p!==null&&p>30?'#ff9800':'#00e5ff');
          const row=(k,x)=>'<div class="r"><span class="k">'+k+'</span><span class="x">'+x+'</span></div>';
          return '<div class="bat" style="--c:'+col+'"><div class="shell"><div class="cap"></div><div class="lvl'+(p!==null&&p<-30?' chg':'')+'" style="height:'+(soc===null?0:soc)+'%"></div><div class="txt">'+f(soc)+'%</div></div>'
           +'<div class="info">'
           +row('Moc',(p===null?'—':(p<0?'↓ ładowanie ':(p>0?'↑ rozładowanie ':''))+Math.abs(p).toFixed(0))+' W')
           +row('Napięcie',f(v('sensor.srne_battery_voltage'),1)+' V')
           +row('Prąd',f(v('sensor.srne_battery_current'),1)+' A')
           +row('Temperatura',f(v('sensor.srne_battery_temperature'),1)+' °C')
           +row('Stan ładowania',t('sensor.srne_charge_state'))
           +row('SOH',f(v('sensor.srne_battery_soh'))+' %')
           +'</div></div>';

          ]]]
