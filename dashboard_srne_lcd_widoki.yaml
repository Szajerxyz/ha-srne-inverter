  # ===== SRNE LCD v2: jedna zakładka + podwidoki (PV, Sieć, Magazyn, Odbiory, Falownik z ustawieniami) =====
  # Wymagane: motyw "SRNE LCD" (srne_lcd_theme.yaml) oraz HACS: button-card, mushroom, apexcharts-card, modern-circular-gauge.
  # Dopisz na końcu listy `views:` w surowym edytorze konfiguracji (wcięcie 2 spacje).
  # Podwidoki (subview: true) nie są pokazywane na pasku zakładek - otwiera się je kliknięciem w kafelek.
  - title: SRNE LCD
    path: srne-lcd
    icon: mdi:solar-power-variant
    theme: SRNE LCD
    cards:
    - type: picture-elements
      image: data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='340' viewBox='0 0 400 340'%3E%3C/svg%3E
      elements:
      - type: custom:button-card
        entity: sensor.srne_pv_total_power
        triggers_update:
        - sensor.srne_battery_power
        - sensor.srne_grid_total_active_power
        - sensor.srne_load_total_active_power
        - sensor.srne_pv_total_power
        show_name: false
        show_icon: false
        show_state: false
        show_label: false
        custom_fields:
          lines: |-
            [[[
            const v=(id)=>{const s=states[id];return (s&&s.state!=='unavailable'&&s.state!=='unknown'&&s.state!=='')?Number(s.state):null;};const f=(x,d=0)=>x===null?'—':x.toFixed(d);const t=(id)=>{const s=states[id];return s?s.state:'—';};

            const pv=v('sensor.srne_pv_total_power'),gr=v('sensor.srne_grid_total_active_power'),bp=v('sensor.srne_battery_power'),ld=v('sensor.srne_load_total_active_power');
            const Y='#ffc107',G='#00e676',O='#ff9800',B='#40c4ff',C='#00e5ff';
            const dur=(p)=>Math.max(0.35,2.4-Math.min(Math.abs(p),12000)/12000*2.05).toFixed(2);
            const on=(p)=>p!==null&&Math.abs(p)>30;
            const ln=(d,p,col,rev)=>'<path class="ln'+(on(p)?'':' off')+'" d="'+d+'" style="stroke:'+col+';'+(on(p)?'animation-duration:'+dur(p)+'s;animation-direction:'+(rev?'reverse':'normal')+';':'')+'"/>';
            const gc=gr===null?C:(gr>30?G:(gr<-30?O:C));
            const bc=bp===null?C:(bp<-30?G:(bp>30?O:C));
            return '<svg class="lines" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">'
             +ln('M 70 62 C 150 62 140 150 200 170',pv,Y,false)
             +ln('M 330 62 C 250 62 260 150 200 170',gr,gc,gr!==null&&gr>0)
             +ln('M 70 278 C 150 278 140 190 200 170',bp,bc,bp!==null&&bp<0)
             +ln('M 200 170 C 260 190 250 278 330 278',ld,B,false)
             +'</svg>';

            ]]]
        styles:
          grid:
          - grid-template-areas: '"lines"'
          - grid-template-columns: 1fr
          card:
          - padding: '0'
          - background: none
          - border: none
          - box-shadow: none
          - overflow: visible
        extra_styles: |-
          .lines{display:block;width:100%;}
          .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 9;animation:flow 1s linear infinite;}
          .ln.off{animation:none;opacity:.15;stroke-dasharray:2 10;}
          @keyframes flow{to{stroke-dashoffset:-32;}}
        style:
          left: 50%
          top: 50%
          width: 100%
          pointer-events: none
      - type: custom:button-card
