  - title: Odbiory
    path: srne-lcd-load
    icon: mdi:home-lightning-bolt
    subview: true
    back_path: srne-lcd
    theme: SRNE LCD
    cards:
    - type: grid
      columns: 1
      square: false
      cards:
      - type: custom:modern-circular-gauge
        entity: sensor.srne_load_total_active_power
        name: Odbiory
        min: 0
        max: 12000
        unit: W
        smooth_segments: true
        adaptive_icon_color: true
        gauge_foreground_style:
          color: adaptive
        gauge_background_style:
          width: 2
          color: adaptive
        segments:
        - from: 0
          color: *id002
        - from: 6000
          color: *id003
        - from: 10000
          color: *id004
    - type: custom:button-card
      entity: sensor.srne_load_total_active_power
      triggers_update:
      - sensor.srne_load_total_active_power
      - sensor.zmywarka_mqtt_power
      - sensor.pralka_mqtt_power
      - sensor.suszarka_mqtt_power
      - sensor.lodowka_mqtt_power
      - sensor.rtv_mqtt_power
      - sensor.licznik_pompa_power
      - sensor.licznik_ind_piek_power
      - sensor.karol_pc_power
      - sensor.adam_pc_power
      - sensor.szafa_rack_mqtt_power
      - sensor.klimatyzacja_salon_mqtt_power
      variables:
        # >>> DODAJ SWOJE ODBIORNIKI: nowy wiersz  - [Nazwa, sensor.encja_mocy, mdi:ikona]  (ikona opcjonalna) <<<
        odbiorniki:
        - [Zmywarka, sensor.zmywarka_mqtt_power, 'mdi:dishwasher']
        - [Pralka, sensor.pralka_mqtt_power, 'mdi:washing-machine']
        - [Suszarka, sensor.suszarka_mqtt_power, 'mdi:tumble-dryer']
        - [Lodówka, sensor.lodowka_mqtt_power, 'mdi:fridge']
        - [RTV, sensor.rtv_mqtt_power, 'mdi:television']
        - [Pompa ciepła, sensor.licznik_pompa_power, 'mdi:heat-pump']
        - [Indukcja i piekarnik, sensor.licznik_ind_piek_power, 'mdi:stove']
        - [Komputer Karola, sensor.karol_pc_power, 'mdi:desktop-tower']
        - [Komputer Adama, sensor.adam_pc_power, 'mdi:desktop-tower']
        - [Szafa rack, sensor.szafa_rack_mqtt_power, 'mdi:server-network']
        - [Klimatyzacja salon, sensor.klimatyzacja_salon_mqtt_power, 'mdi:air-conditioner']
      show_name: false
      show_icon: false
      show_state: false
      show_label: false
      custom_fields:
        panel: |-
          [[[
          const v=(id)=>{const s=states[id];return (s&&s.state!=='unavailable'&&s.state!=='unknown'&&s.state!=='')?Number(s.state):null;};const f=(x,d=0)=>x===null?'—':x.toFixed(d);const t=(id)=>{const s=states[id];return s?s.state:'—';};

          const list=variables.odbiorniki||[];
          const pw=(id)=>{const s=states[id];if(!s||s.state===''||isNaN(s.state))return null;let x=Number(s.state);const u=s.attributes&&s.attributes.unit_of_measurement;if(u==='kW')x*=1000;return x;};
          const fw=(x)=>x===null?'—':(x>=1000?(x/1000).toFixed(2)+' kW':Math.round(x)+' W');
          const total=v('sensor.srne_load_total_active_power');
          const rows=list.map(x=>({n:x[0],ic:x[2]||'mdi:power-plug',w:pw(x[1])}));
          const known=rows.reduce((a,r)=>a+(r.w>0?r.w:0),0);
          rows.sort((a,b)=>(b.w||0)-(a.w||0));
          const max=Math.max(1,...rows.map(r=>r.w||0));
          const rest=total===null?null:Math.max(0,total-known);
          return '<div class="od"><div class="ttl"><span>Odbiorniki</span><span>'+fw(known)+'</span></div>'
           +rows.map(r=>'<div class="row'+((r.w===null||r.w<5)?' off':'')+'"><ha-icon icon="'+r.ic+'"></ha-icon><span class="nm">'+r.n+'</span><span class="w">'+fw(r.w)+'</span><div class="bar2"><i style="width:'+Math.round(((r.w||0)/max)*100)+'%"></i></div></div>').join('')
           +'<div class="sum"><span>Suma opomiarowanych</span><b>'+fw(known)+'</b></div>'
           +'<div class="sum"><span>Pozostałe (LOAD − opomiarowane)</span><b>'+fw(rest)+'</b></div></div>';

          ]]]
      styles:
        grid:
        - grid-template-areas: '"panel"'
        - grid-template-columns: 1fr
        card:
        - padding: 10px
        - border-radius: 18px
