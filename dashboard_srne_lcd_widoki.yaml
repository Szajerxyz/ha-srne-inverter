          - grid-template-areas: '"node"'
          - grid-template-columns: 1fr
          card:
          - padding: '0'
          - background: none
          - border: none
          - box-shadow: none
          - overflow: visible
        extra_styles: |-
          @keyframes pulse{0%,100%{box-shadow:0 0 6px var(--c),inset 0 0 6px rgba(0,0,0,.4);}50%{box-shadow:0 0 20px var(--c),inset 0 0 8px rgba(0,0,0,.4);}}
          @keyframes pulse2{0%,100%{box-shadow:0 0 0 7px var(--cr),0 0 8px var(--c);}50%{box-shadow:0 0 0 7px var(--cr),0 0 22px var(--c);}}
          @keyframes shine{to{background-position:-200% 0;}}
          .node{text-align:center;background:rgba(6,18,38,.94);border:1.5px solid var(--c);border-radius:18px;padding:8px 4px;box-shadow:0 0 10px var(--c);}
          .node.active{animation:pulse 2.4s ease-in-out infinite;}
          .node ha-icon{--mdc-icon-size:28px;color:var(--c);}
          .node .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7fd8ff;opacity:.85;}
          .node .v{font-size:clamp(14px,4.4vw,22px);font-weight:700;color:#eafaff;text-shadow:0 0 8px var(--c);}
          .node .s{font-size:clamp(9px,2.6vw,11px);color:#b8e6f5;opacity:.8;line-height:1.35;}
          .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin:5px 10px 0;overflow:hidden;}
          .bar i{display:block;height:100%;border-radius:3px;background:var(--c);}
          .bar i.chg{background:linear-gradient(90deg,var(--c),#d7ffe6,var(--c));background-size:200% 100%;animation:shine 1.5s linear infinite;}
          .inv{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:12px;}
          .circle{width:76%;aspect-ratio:1/1;border-radius:50%;background:var(--c);box-shadow:0 0 0 7px var(--cr),0 0 10px var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
          .circle.active{animation:pulse2 2.4s ease-in-out infinite;}
          .sym{display:flex;gap:10px;align-items:center;}
          .sym svg{height:15px;width:auto;}
          .sym .dc{fill:#fff;}
          .sym .ac{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;}
          .circle .t{font-size:clamp(8px,2.7vw,12px);font-weight:800;letter-spacing:.05em;color:#fff;}
          .inv .s{font-size:clamp(9px,2.6vw,11px);color:#b8e6f5;opacity:.85;line-height:1.35;}
          .fcode{border:1.5px solid #ff5252;background:rgba(255,82,82,.22);color:#ffd0d0;font-family:'Courier New',monospace;font-weight:800;font-size:clamp(16px,5vw,26px);letter-spacing:.12em;padding:1px 12px;border-radius:4px;text-shadow:0 0 8px #ff5252;}
