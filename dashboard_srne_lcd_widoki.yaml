             +((!on&&!items.length)?'<div class="ok">Brak błędów</div>':items.map(x=>'<div class="f"><span class="n">'+pad(x.c)+'</span><span class="tx">'+x.t+(x.o?'<span class="w">wyłącza wyjście falownika</span>':'')+'</span></div>').join(''))
             +'</div>';

